services:
  - type: web
    name: tip-it-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 180d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_REFRESH_URL
        sync: false
      - key: STRIPE_CONNECT_RETURN_URL
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: 6
      - key: PLATFORM_FEE_FIXED_CENTS
        value: 400
      # Sign-up and login with a code (all optional; see docs/REGISTRO_CON_CODIGO.md)
      - key: OTP_REQUIRED
        value: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_EMAIL_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SID
        sync: false
      - key: OTP_WHATSAPP
        value: false

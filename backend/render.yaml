services:
  - type: web
    name: tip-it-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 180d
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_REFRESH_URL
        sync: false
      - key: STRIPE_CONNECT_RETURN_URL
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: 11
      - key: PLATFORM_FEE_FIXED_CENTS
        value: 400

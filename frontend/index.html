<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF8243" />
    <meta name="description" content="Cada vez hay menos cash. Con tu QR de TIP-IT, tus clientes te dejan propina con tarjeta o Apple Pay y te llega directo a tu banco. Para barberos, estilistas, músicos y puestos de comida." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://www.tipit.com.mx/" />
    <meta property="og:site_name" content="TIP-IT" />
    <meta property="og:title" content="TIP-IT — Que no se te vayan tus propinas" />
    <meta property="og:description" content="Cada vez hay menos cash. Con tu QR de TIP-IT, tus clientes te dejan propina en segundos y te llega directo a tu banco." />
    <meta property="og:image" content="https://www.tipit.com.mx/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.tipit.com.mx/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Start talking to the API server right away (it can be asleep): -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <link rel="preload" href="/fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dmsans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Someone scanned a QR (/tip/:username): ask the API for that worker NOW,
      // in parallel with downloading the app, instead of after it boots.
      (function () {
        try {
          var api = '%VITE_API_URL%';
          var m = location.pathname.match(/^\/tip\/([^\/?#]+)/);
          if (!m || !api || api.indexOf('%') !== -1) return;
          var u = decodeURIComponent(m[1]).toLowerCase();
          window.__tipPrefetch = {
            username: u,
            p: fetch(api + '/workers/' + encodeURIComponent(u), { headers: { Accept: 'application/json' } }).then(
              function (r) {
                return r.json().then(function (j) {
                  return { ok: r.ok, data: j };
                });
              }
            ),
          };
          window.__tipPrefetch.p.catch(function () {});
        } catch (e) {}
      })();
    </script>
    <title>TIP-IT — Propinas digitales por QR, sin efectivo</title>

    <!-- Analytics (GA4) is loaded only after the visitor accepts cookies: see src/utils/consent.js -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>TIP-IT necesita JavaScript para funcionar. Actívalo en tu navegador e intenta de nuevo.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

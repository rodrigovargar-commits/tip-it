name: Keep API warm

# The API runs on Render's free plan, which puts it to sleep after ~15 minutes
# without traffic; the first person to scan a QR afterwards waits up to a
# minute. A light ping every 10 minutes keeps it awake. (A paid Render plan
# makes this unnecessary.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 60 --retry 2 https://tip-it-backend-65q4.onrender.com/api/health

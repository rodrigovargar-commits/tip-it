name: CI

# Pipeline de la sección 10 de RV Mejores Practicas Desarrollo.md, adaptado al
# stack real de este repo (Node/Express, sin Terraform/Checkov todavía). Cada
# job corresponde a una fila de esa tabla; el criterio de bloqueo está en el
# comentario de cada uno.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Pruebas (backend)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci
      - name: Ejecutar pruebas
        working-directory: backend
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/tip-it-test
          JWT_SECRET: ci-test-secret-not-a-real-secret
        run: npm test
      # Criterio de bloqueo: cualquier prueba fallida bloquea el merge (§10).

  frontend-build:
    name: Build (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Build de producción
        working-directory: frontend
        run: npm run build
      # Criterio de bloqueo: cualquier error de build bloquea el merge.

  secrets-scan:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      # Criterio de bloqueo: cualquier coincidencia (§2.1, §10).

  sast:
    name: Análisis estático (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install semgrep
      - name: Semgrep (reglas OWASP + reglas de seguridad para JS/Node)
        run: |
          semgrep scan --exclude node_modules --config p/javascript --config p/nodejs --config p/owasp-top-ten --error --metrics=off
      # Criterio de bloqueo: cualquier hallazgo alto o crítico (§10).
      # Sin login a Semgrep Cloud: paquetes públicos p/javascript, p/nodejs y
      # p/owasp-top-ten (`--config auto` exige métricas activas, por eso no se usa).

  dependency-scan:
    name: Dependencias (Trivy — SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          skip-dirs: frontend/node_modules,backend/node_modules
      # Criterio de bloqueo: CVE crítico o alto con parche disponible (§10).
      - name: SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
          skip-dirs: frontend/node_modules,backend/node_modules
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom.cdx.json
